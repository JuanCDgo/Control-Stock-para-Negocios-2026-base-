[theme]
base = "light"
# Paleta: slate (texto y bordes) + azul para acciones; el cobro usa verde (ver CSS en app.py)
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#E2E8F0"
showWidgetBorder = true
linkColor = "#1D4ED8"

# Tipografía: Nunito Sans para el texto, Rubik para títulos
font = "Nunito Sans:https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap"
headingFont = "Rubik:https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&display=swap"
baseFontSize = 15
headingFontSizes = ["1.75rem", "1.375rem", "1.125rem", "1rem", "0.95rem", "0.9rem"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
metricValueFontSize = "1.5rem"

# Formas: un solo radio para botones, campos, tarjetas y desplegables
baseRadius = "0.5rem"
buttonRadius = "0.5rem"

dataframeHeaderBackgroundColor = "#F1F5F9"

[client]
toolbarMode = "viewer"
